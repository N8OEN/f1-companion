<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a"/>
      <stop offset="100%" style="stop-color:#0d0d0d"/>
    </linearGradient>
    <linearGradient id="red" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e8001f"/>
      <stop offset="100%" style="stop-color:#cc0018"/>
    </linearGradient>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>

  <!-- Speed lines - angled stripes top right -->
  <g opacity="0.12">
    <polygon points="320,0 512,0 512,60 260,60" fill="#e8001f"/>
    <polygon points="360,80 512,80 512,110 330,110" fill="#e8001f"/>
    <polygon points="400,130 512,130 512,155 375,155" fill="#e8001f"/>
  </g>

  <!-- Red accent bar -->
  <rect x="56" y="56" width="180" height="14" rx="7" fill="url(#red)"/>

  <!-- F -->
  <rect x="56" y="90" width="26" height="160" rx="6" fill="#f0f0f0"/>
  <rect x="56" y="90" width="110" height="26" rx="6" fill="#f0f0f0"/>
  <rect x="56" y="158" width="88" height="24" rx="6" fill="#f0f0f0"/>

  <!-- 1 -->
  <rect x="196" y="90" width="26" height="160" rx="6" fill="#f0f0f0"/>
  <polygon points="196,90 222,90 196,126" fill="#f0f0f0"/>
  <line x1="176" y1="250" x2="248" y2="250" stroke="#f0f0f0" stroke-width="18" stroke-linecap="round"/>

  <!-- Divider dot -->
  <circle cx="278" cy="170" r="12" fill="#e8001f"/>

  <!-- C -->
  <path d="M 460 110 A 120 120 0 1 0 460 230" fill="none" stroke="#f0f0f0" stroke-width="28" stroke-linecap="round"/>

  <!-- COMPANION label -->
  <text x="256" y="370" font-family="Arial Black, sans-serif" font-size="48" font-weight="900" fill="#e8001f" text-anchor="middle" letter-spacing="6">COMPANION</text>

  <!-- Bottom red bar -->
  <rect x="56" y="420" width="400" height="10" rx="5" fill="#e8001f" opacity="0.5"/>
  <rect x="56" y="420" width="120" height="10" rx="5" fill="#e8001f"/>
</svg>